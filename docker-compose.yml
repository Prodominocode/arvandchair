services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arvand
      POSTGRES_PASSWORD: arvand
      POSTGRES_DB: arvandchair
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: localdev-key
    ports:
      - '7700:7700'
    volumes:
      - meili-data:/meili_data

  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP — همین را در .env بگذار
      - '8025:8025' # وب UI برای دیدن ایمیل‌ها

volumes:
  postgres-data:
  meili-data:
